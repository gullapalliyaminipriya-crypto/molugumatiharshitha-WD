
<!DOCTYPE html>
<html>
<head>
<title>ShopEasy</title>
<style>
body {font-family: Arial; margin: 0; background: #f4f4f4;}
nav {background: #222; color: white; padding: 15px;}
nav a {color: white; margin: 12px; text-decoration: none;}
.banner {background: orange; padding: 20px; text-align: center;}
.products {display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; padding: 20px;}
.card {background: white; padding: 15px; width: 200px; text-align: center; border-radius: 8px;}
.card img {width: 100%; height: 130px; object-fit: contain;}
button {background: green; color: white; padding: 10px; border: none; cursor: pointer;}
</style>
</head>
<body>

<nav>
<b>ShopEasy</b>
<a href="#">Home</a>
<a href="#">Categories</a>

</div>

<div class="products">

<h3>Headphones</h3>

<div class="card">

</div>

</html>
